<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overwatch Counter Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Saira+Condensed:wght@600;700;800&display=swap" />
</head>
<body>
    <header class="app-header">
        <div class="header-top">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <h1>Counter Picker</h1>
            </div>
            <span class="data-version" data-part="version"></span>
            <button type="button" class="text-button" data-part="clear">Clear map</button>
        </div>

        <nav class="match-bar" aria-label="Match setup">
            <div class="match-field">
                <span class="field-label" id="mode-label">Mode</span>
                <div class="segmented mode-tabs" data-part="modes" role="group" aria-labelledby="mode-label"></div>
            </div>
            <div class="match-field">
                <label class="field-label" for="map-select">Map</label>
                <select id="map-select" class="map-select" data-part="map"></select>
            </div>
            <div class="match-field">
                <span class="field-label" id="point-label">Point</span>
                <div class="segmented chip-row" data-part="points" role="group" aria-labelledby="point-label"></div>
            </div>
            <div class="match-field side-field" data-part="sides-field" hidden>
                <span class="field-label" id="side-label">Side</span>
                <div class="segmented" data-part="sides" role="group" aria-labelledby="side-label"></div>
            </div>
        </nav>
    </header>

    <p class="load-error" role="alert" hidden></p>

    <main class="main-container">
        <aside class="hero-selector" aria-label="Hero pool">
            <h2 class="pool-title">Hero pool</h2>
            <p class="pool-hint">Drag a hero onto a slot. Bright icons fit the selected point.</p>
            <div class="role-section" data-role="tank">
                <div class="role-header"><div class="role-icon role-tank"></div><span>Tank</span></div>
                <div class="hero-grid"></div>
            </div>
            <div class="role-section" data-role="damage">
                <div class="role-header"><div class="role-icon role-damage"></div><span>Damage</span></div>
                <div class="hero-grid"></div>
            </div>
            <div class="role-section" data-role="support">
                <div class="role-header"><div class="role-icon role-support"></div><span>Support</span></div>
                <div class="hero-grid"></div>
            </div>
        </aside>

        <div class="scoreboard board-yours">
            <div class="team blue-team">
                <div class="team-header-container">
                    <h2 class="team-header">Your team</h2>
                    <button class="clear-teams" data-clear-team="counter" type="button">Clear</button>
                </div>
                <div class="team-rows" data-team="counter"></div>
                <div class="total-score-display"></div>
            </div>
        </div>

        <div class="right-column" data-empty="Fill all five enemy slots to see suggested picks."></div>

        <div class="vs-divider" aria-hidden="true"><span>VS</span></div>
        <div class="insight-gap" aria-hidden="true"></div>

        <div class="scoreboard board-enemy">
            <div class="team red-team">
                <div class="team-header-container">
                    <h2 class="team-header">Enemy team</h2>
                    <div class="header-actions">
                        <button class="icon-button" data-randomize-team="enemy" type="button" aria-label="Randomize enemy team" data-tip='{"title":"Randomize","note":"Fill the enemy team with random heroes."}'>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" />
                                <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none" />
                                <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor" stroke="none" />
                                <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
                                <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor" stroke="none" />
                                <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none" />
                            </svg>
                        </button>
                        <button class="clear-teams" data-clear-team="enemy" type="button">Clear</button>
                    </div>
                </div>
                <div class="team-rows" data-team="enemy"></div>
                <div class="total-score-display"></div>
            </div>
        </div>

        <div class="compass-card">
            <div class="compass-head">
                <h2 class="team-header">Comp read</h2>
                <span class="compass-where" data-part="where"></span>
            </div>
            <div class="compass-body">
                <div class="compass-plot" data-part="plot"></div>
                <div class="compass-legend" data-part="legend"></div>
            </div>
            <p class="compass-verdict" data-part="verdict"></p>
        </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
