<!DOCTYPE html>
<html>
<head>
    <title>OW2 Counter Picker</title>
    <link rel="stylesheet" href="/resources/css/styles.css">
</head>
<body>
    <div class="main-container">
        <div class="left-column">
            <!-- Current picks block -->
            <div class="scoreboard">
                <div class="team blue-team">
                    <div class="team-header-container">
                        <div class="team-header">CURRENT PICKS</div>
                        <button class="clear-teams" onclick="clearTeam('counter')">Clear</button>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-tank"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="0" data-role="tank">
                            <option value="">Select Tank</option>
                        </select>
                        <div class="score-section">
                            <div class="current-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-damage"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="1" data-role="damage">
                            <option value="">Select Damage 1</option>
                        </select>
                        <div class="score-section">
                            <div class="current-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-damage"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="2" data-role="damage">
                            <option value="">Select Damage 2</option>
                        </select>
                        <div class="score-section">
                            <div class="current-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="3" data-role="support">
                            <option value="">Select Support 1</option>
                        </select>
                        <div class="score-section">
                            <div class="current-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="4" data-role="support">
                            <option value="">Select Support 2</option>
                        </select>
                        <div class="score-section">
                            <div class="current-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="total-score-display"></div>
                </div>
            </div>

            <!-- VS divider -->
            <div class="vs-divider">VS</div>

            <!-- Enemy team block -->
            <div class="scoreboard">
                <div class="team red-team">
                    <div class="team-header-container">
                        <div class="team-header">ENEMY TEAM</div>
                        <button class="clear-teams" onclick="clearTeam('enemy')">Clear</button>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-tank"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="0" data-role="tank">
                            <option value="">Select Tank</option>
                        </select>
                        <div class="score-section">
                            <div class="enemy-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-damage"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="1" data-role="damage">
                            <option value="">Select Damage 1</option>
                        </select>
                        <div class="score-section">
                            <div class="enemy-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-damage"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="2" data-role="damage">
                            <option value="">Select Damage 2</option>
                        </select>
                        <div class="score-section">
                            <div class="enemy-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="3" data-role="support">
                            <option value="">Select Support 1</option>
                        </select>
                        <div class="score-section">
                            <div class="enemy-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="4" data-role="support">
                            <option value="">Select Support 2</option>
                        </select>
                        <div class="score-section">
                            <div class="enemy-score"></div>
                            <div class="countered-heroes"></div>
                            <div class="synergizing-heroes"></div>
                        </div>
                    </div>
                    <div class="total-score-display"></div>
                </div>
            </div>
        </div>

        <div class="right-column">
            <!-- Future counter pick blocks will go here -->
        </div>
    </div>

    <!-- Add this right after <body> -->
    <div class="hero-selector">
        <div class="role-section" data-role="tank">
            <div class="role-header">
                <div class="role-icon role-tank"></div>
                <span>Tanks</span>
            </div>
            <div class="hero-grid"></div>
        </div>
        <div class="role-section" data-role="damage">
            <div class="role-header">
                <div class="role-icon role-damage"></div>
                <span>Damage</span>
            </div>
            <div class="hero-grid"></div>
        </div>
        <div class="role-section" data-role="support">
            <div class="role-header">
                <div class="role-icon role-support"></div>
                <span>Support</span>
            </div>
            <div class="hero-grid"></div>
        </div>
    </div>

    <!-- Load JavaScript modules -->
    <script src="/resources/js/utils.js"></script>
    <script src="/resources/js/api.js"></script>
    <script src="/resources/js/heroSelector.js"></script>
    <script src="/resources/js/teamManager.js"></script>
    <script src="/resources/js/suggestionManager.js"></script>
    <script src="/resources/js/scoreManager.js"></script>
    <script src="/resources/js/app.js"></script>
</body>
</html>
