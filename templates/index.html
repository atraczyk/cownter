<!DOCTYPE html>
<html>
<head>
    <title>OW2 Counter Picker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .scoreboard {
            width: 100%;
            max-width: none;
            margin: 0;
            background: transparent;
            padding: 0;
            box-shadow: none;
        }
        .team {
            width: 100%;
            padding: 20px;
            border-radius: 8px;
        }
        .team-header {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .blue-team {
            background: linear-gradient(to bottom, #0066cc10, #0066cc20);
            border: 1px solid #0066cc30;
        }
        .blue-team .team-header {
            color: #0066cc;
        }
        .red-team {
            background: linear-gradient(to bottom, #cc000010, #cc000020);
            border: 1px solid #cc000030;
        }
        .red-team .team-header {
            color: #cc0000;
        }
        .player-row {
            display: grid;
            grid-template-columns: 40px 40px 1fr 40px;  /* Change auto to 1fr for select, fixed width for score */
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            margin: 4px 0;
            align-items: center;
            gap: 10px;
        }
        .player-icon {
            display: none;
        }
        .role-icon {
            width: 30px;
            height: 30px;
            background-size: cover;
            background-position: center;
        }
        .role-tank { background-image: url('/resources/roles/tank.svg'); }
        .role-dps { background-image: url('/resources/roles/dps.svg'); }
        .role-support { background-image: url('/resources/roles/support.svg'); }
        .hero-icon {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
        }
        .hero-select {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .suggestion {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score {
            color: #666;
            font-weight: bold;
        }
        .vs-divider {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
            color: #888;
        }
        /* Make dropdowns look nicer */
        select {
            width: 100%;  /* Fill available space */
            min-width: 0;  /* Allow shrinking */
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
        }
        /* Add styles for the clear button */
        .team-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clear-teams {
            font-size: 14px;
            color: #666;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .clear-teams:hover {
            background-color: #f0f0f0;
        }

        /* Update layout styles */
        .main-container {
            max-width: 400px;  /* Match left column width for now */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        /* This will be used when we add suggestion blocks */
        @media (min-width: 1200px) {
            .main-container {
                max-width: 1400px;
                display: grid;
                grid-template-columns: 400px 1fr;
            }

            .left-column {
                width: 400px;
            }
        }

        /* Update suggestion block styles */
        .suggestion-block {
            background: linear-gradient(to bottom, #00cc6610, #00cc6620);
            border: 1px solid #00cc6630;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            max-width: 400px;  /* Match the width of team blocks */
        }

        .suggestion-block .player-row {
            grid-template-columns: 30px 30px auto 40px;  /* More compact grid */
            padding: 8px;  /* Reduce padding */
            gap: 8px;  /* Reduce gap */
        }

        .suggestion-block .role-icon,
        .suggestion-block .hero-icon {
            width: 24px;  /* Slightly smaller icons */
            height: 24px;
        }

        .suggestion-block .score {
            text-align: right;
            font-size: 14px;
        }

        /* Update right column layout */
        .right-column {
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;  /* Align blocks to the left */
            gap: 15px;  /* Space between suggestion blocks */
        }

        /* Update media query */
        @media (min-width: 1200px) {
            .main-container {
                max-width: 1400px;
                display: grid;
                grid-template-columns: 400px 1fr;
                gap: 40px;  /* Increase gap between columns */
            }

            .left-column {
                width: 400px;
            }

            .right-column {
                padding-top: 0;
            }
        }

        /* Update score display styles */
        .score-display {
            color: #666;
            font-size: 14px;
            font-weight: bold;
            margin-left: auto;
        }

        /* Update total score styles to be consistent */
        .total-score-display {
            font-size: 14px;
            color: #666;
            margin: 15px 8px 5px 0;  /* top right bottom left */
            text-align: right;
            padding: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        /* Remove old total-score class */
        .total-score {
            display: none;  /* Hide old style */
        }

        /* Update the score colors */
        .current-score {
            color: #0066cc;
            font-size: 14px;
            font-weight: bold;
            text-align: right;
            min-width: 40px;  /* Match grid column width */
        }

        .suggestion-block .score {
            color: #00cc66;  /* Green for suggestions */
            font-size: 14px;
            font-weight: bold;
            margin-left: auto;
            min-width: 20px;  /* Ensure space for score */
            text-align: right;
        }

        /* Add enemy score styles */
        .enemy-score {
            color: #cc0000;
            font-size: 14px;
            font-weight: bold;
            text-align: right;
            min-width: 40px;  /* Match grid column width */
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-column">
            <!-- Current picks block -->
            <div class="scoreboard">
                <div class="team blue-team">
                    <div class="team-header-container">
                        <div class="team-header">CURRENT PICKS</div>
                        <button class="clear-teams" onclick="clearTeams()">Clear All</button>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-tank"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="0" data-role="tank">
                            <option value="">Select Tank</option>
                        </select>
                        <div class="current-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-dps"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="1" data-role="dps">
                            <option value="">Select DPS 1</option>
                        </select>
                        <div class="current-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-dps"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="2" data-role="dps">
                            <option value="">Select DPS 2</option>
                        </select>
                        <div class="current-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="3" data-role="support">
                            <option value="">Select Support 1</option>
                        </select>
                        <div class="current-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="counter" data-slot="4" data-role="support">
                            <option value="">Select Support 2</option>
                        </select>
                        <div class="current-score"></div>
                    </div>
                    <div class="total-score-display"></div>
                </div>
            </div>

            <!-- VS divider -->
            <div class="vs-divider">VS</div>

            <!-- Enemy team block -->
            <div class="scoreboard">
                <div class="team red-team">
                    <div class="team-header">ENEMY TEAM</div>
                    <div class="player-row">
                        <div class="role-icon role-tank"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="0" data-role="tank">
                            <option value="">Select Tank</option>
                        </select>
                        <div class="enemy-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-dps"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="1" data-role="dps">
                            <option value="">Select DPS 1</option>
                        </select>
                        <div class="enemy-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-dps"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="2" data-role="dps">
                            <option value="">Select DPS 2</option>
                        </select>
                        <div class="enemy-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="3" data-role="support">
                            <option value="">Select Support 1</option>
                        </select>
                        <div class="enemy-score"></div>
                    </div>
                    <div class="player-row">
                        <div class="role-icon role-support"></div>
                        <div class="hero-icon"></div>
                        <select class="hero-select" data-team="enemy" data-slot="4" data-role="support">
                            <option value="">Select Support 2</option>
                        </select>
                        <div class="enemy-score"></div>
                    </div>
                    <div class="total-score-display"></div>
                </div>
            </div>
        </div>

        <div class="right-column">
            <!-- Future counter pick blocks will go here -->
        </div>
    </div>

    <script>
        function getHeroIcon(hero) {
            if (!hero) return '';
            return `/resources/icon-${hero.toLowerCase()}.png`;
        }

        function updateHeroIcon(select) {
            const hero = select.value;
            const row = select.closest('.player-row');
            const iconDiv = row.querySelector('.hero-icon');
            if (hero) {
                iconDiv.style.backgroundImage = `url('${getHeroIcon(hero)}')`;
            } else {
                iconDiv.style.backgroundImage = 'none';
            }
        }

        // Add this function to get a hero's role
        function getHeroRole(hero, heroData) {
            return heroData[hero]?.role || 'unknown';
        }

        // Add this function to get currently selected heroes for a team
        function getSelectedHeroes(team) {
            return Array.from(document.querySelectorAll(`.hero-select[data-team="${team}"]`))
                .map(select => select.value)
                .filter(Boolean);  // Remove empty values
        }

        // Update the dropdown population logic
        function updateDropdowns(heroData) {
            document.querySelectorAll('.hero-select').forEach(select => {
                const role = select.dataset.role;
                const team = select.dataset.team;
                const currentSlot = select.dataset.slot;
                const currentValue = select.value;

                // Get heroes that are already selected in this team for this role
                const selectedHeroes = Array.from(document.querySelectorAll(`.hero-select[data-team="${team}"][data-role="${role}"]`))
                    .filter(otherSelect => otherSelect.dataset.slot !== currentSlot)  // Exclude current slot
                    .map(select => select.value)
                    .filter(Boolean);

                // Filter heroes by role and remove those selected in other slots of same role
                const filteredHeroes = Object.entries(heroData)
                    .filter(([hero, data]) => data.role === role && !selectedHeroes.includes(hero))
                    .map(([hero, _]) => hero)
                    .sort();

                // Clear existing options except the first one
                while (select.options.length > 1) {
                    select.remove(1);
                }

                // Add filtered heroes to dropdown
                filteredHeroes.forEach(hero => {
                    const option = document.createElement('option');
                    option.value = hero;
                    option.textContent = hero;
                    select.appendChild(option);
                });

                // Restore current selection if it exists
                if (currentValue) {
                    select.value = currentValue;
                }
            });
        }

        // Update the hero selection handler
        document.querySelectorAll('.hero-select').forEach(select => {
            select.addEventListener('change', (e) => {
                const team = e.target.dataset.team;
                const slot = e.target.dataset.slot;
                const hero = e.target.value;

                // Update the hero icon
                updateHeroIcon(e.target);

                // Update server state
                fetch('/api/update_team', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        team: team,
                        slot: slot,
                        hero: hero
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                        e.target.value = '';
                        updateHeroIcon(e.target);
                        return;
                    }
                    // Save the updated teams
                    saveTeams(data.teams);

                    // Get current scores
                    fetch('/api/current_scores')
                        .then(response => response.json())
                        .then(data => {
                            console.log('Current scores response:', data);  // Debug log
                            console.log('Current scores:', data.current_scores);  // Debug log
                            console.log('Enemy scores:', data.enemy_scores);  // Debug log
                            updateTeamScores({
                                current_scores: data.current_scores,
                                enemy_scores: data.enemy_scores
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching scores:', error);
                        });

                    // Update all dropdowns to reflect new selection
                    fetch('/api/heroes_with_roles')
                        .then(response => response.json())
                        .then(heroData => updateDropdowns(heroData));

                    // Update suggestions only if enemy team was changed
                    if (team === 'enemy') {
                        updateCounterSuggestions(data.suggestions);
                    }
                });
            });
        });

        function createSuggestionBlock(suggestions) {
            const block = document.createElement('div');
            block.className = 'scoreboard';

            const content = document.createElement('div');
            content.className = 'suggestion-block';

            // Add header
            const header = document.createElement('div');
            header.className = 'team-header';
            header.textContent = 'SUGGESTED PICKS';
            content.appendChild(header);

            // Add player rows for each role
            ['tank', 'dps', 'support'].forEach((role, index) => {
                if (suggestions[role]) {
                    suggestions[role].forEach((heroData, subIndex) => {
                        const [hero, heroScore] = heroData;
                        const row = document.createElement('div');
                        row.className = 'player-row';
                        row.innerHTML = `
                            <div class="role-icon role-${role}"></div>
                            <div class="hero-icon" style="background-image: url('${getHeroIcon(hero)}')"></div>
                            <div style="font-weight: bold;">${hero}</div>
                            <div class="score">${heroScore}</div>
                        `;
                        content.appendChild(row);
                    });
                }
            });

            // Calculate total score from all hero scores
            const totalScore = ['tank', 'dps', 'support'].reduce((total, role) => {
                if (!suggestions[role]) return total;
                return total + suggestions[role].reduce((roleTotal, [_, score]) => roleTotal + score, 0);
            }, 0);

            // Add total score at the bottom
            const score = document.createElement('div');
            score.className = 'total-score-display';
            score.textContent = `Total Score: ${totalScore}`;
            content.appendChild(score);

            block.appendChild(content);
            return block;
        }

        function updateCounterSuggestions(suggestions) {
            if (!suggestions) return;

            const rightColumn = document.querySelector('.right-column');

            // Clear any existing suggestion blocks
            rightColumn.innerHTML = '';

            // Create new suggestion block
            const suggestionBlock = createSuggestionBlock(suggestions);

            // Add to the right column
            rightColumn.appendChild(suggestionBlock);
        }

        // Add these functions to the script section
        function saveTeams(teams) {
            localStorage.setItem('ow2_teams', JSON.stringify(teams));
        }

        function loadTeams() {
            const saved = localStorage.getItem('ow2_teams');
            return saved ? JSON.parse(saved) : {
                enemy: [null, null, null, null, null],
                counter: [null, null, null, null, null]
            };
        }

        function clearTeams() {
            if (!confirm('Clear all team selections?')) return;

            // Clear local storage
            localStorage.removeItem('ow2_teams');

            // Clear all selections and icons
            document.querySelectorAll('.hero-select').forEach(select => {
                select.value = '';
                updateHeroIcon(select);
            });

            // Clear suggestion block
            const rightColumn = document.querySelector('.right-column');
            rightColumn.innerHTML = '';

            // Clear server state
            fetch('/api/clear_teams', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
        }

        // Update the load handler
        window.addEventListener('load', () => {
            const savedTeams = loadTeams();

            // First fetch heroes data
            fetch('/api/heroes_with_roles')
                .then(response => response.json())
                .then(heroData => {
                    // First populate dropdowns
                    updateDropdowns(heroData);

                    // Then restore saved selections
                    Object.entries(savedTeams).forEach(([team, heroes]) => {
                        heroes.forEach((hero, slot) => {
                            if (hero) {
                                const select = document.querySelector(
                                    `.hero-select[data-team="${team}"][data-slot="${slot}"]`
                                );
                                if (select) {
                                    select.value = hero;
                                    updateHeroIcon(select);
                                }
                            }
                        });
                    });

                    // Update server state and get initial scores
                    return fetch('/api/restore_teams', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(savedTeams)
                    });
                })
                .then(response => response.json())
                .then(data => {
                    // Update current team scores immediately
                    if (data.current_scores) {
                        updateTeamScores({
                            current_scores: data.current_scores,
                            enemy_scores: data.enemy_scores
                        });
                    }

                    // Check if enemy team is complete and request suggestions
                    if (data.teams.enemy.every(hero => hero !== null)) {
                        return fetch('/api/update_team', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                team: 'enemy',
                                slot: 0,
                                hero: data.teams.enemy[0]
                            })
                        });
                    }
                })
                .then(response => response && response.json())
                .then(data => {
                    if (data && data.suggestions) {
                        updateCounterSuggestions(data.suggestions);
                    }
                });
        });

        function updateTeamScores(scores) {
            console.log('updateTeamScores called with:', scores);

            // Clear all scores
            document.querySelectorAll('.current-score, .enemy-score').forEach(div => div.textContent = '');
            document.querySelectorAll('.total-score-display').forEach(div => div.textContent = '');

            if (!scores) return;

            // Update current team scores
            if (scores.current_scores) {
                console.log('Updating current scores:', scores.current_scores);
                scores.current_scores.heroes.forEach(([hero, score]) => {
                    console.log(`Looking for current hero ${hero} with score ${score}`);
                    // Get all selects and find the one with matching hero name (case-insensitive)
                    const selects = document.querySelectorAll('.hero-select[data-team="counter"]');
                    const select = Array.from(selects).find(s => s.value.toLowerCase() === hero.toLowerCase());
                    console.log('Found current select:', select);
                    if (select) {
                        const row = select.closest('.player-row');
                        const scoreDiv = row.querySelector('.current-score');
                        console.log('Found current score div:', scoreDiv);
                        if (scoreDiv) {
                            scoreDiv.textContent = score;
                        }
                    }
                });

                // Update current team total score
                const currentTotalDiv = document.querySelector('.team.blue-team .total-score-display');
                if (currentTotalDiv) {
                    currentTotalDiv.textContent = `Total Score: ${scores.current_scores.total_score}`;
                }
            }

            // Update enemy team scores
            if (scores.enemy_scores) {
                console.log('Updating enemy scores:', scores.enemy_scores);
                scores.enemy_scores.heroes.forEach(([hero, score]) => {
                    console.log(`Looking for enemy hero ${hero} with score ${score}`);
                    // Get all selects and find the one with matching hero name (case-insensitive)
                    const selects = document.querySelectorAll('.hero-select[data-team="enemy"]');
                    const select = Array.from(selects).find(s => s.value.toLowerCase() === hero.toLowerCase());
                    console.log('Found enemy select:', select);
                    if (select) {
                        const row = select.closest('.player-row');
                        const scoreDiv = row.querySelector('.enemy-score');
                        console.log('Found enemy score div:', scoreDiv);
                        if (scoreDiv) {
                            scoreDiv.textContent = score;
                        }
                    }
                });

                // Update enemy team total score
                const enemyTotalDiv = document.querySelector('.team.red-team .total-score-display');
                if (enemyTotalDiv) {
                    enemyTotalDiv.textContent = `Total Score: ${scores.enemy_scores.total_score}`;
                }
            }
        }
    </script>
</body>
</html>
